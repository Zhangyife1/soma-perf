services:
  - type: web
    name: soma-perf-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn collect:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SOMA_PUBLIC_MODE
        value: dashboard
      - key: SOMA_DB
        value: /tmp/soma_perf_render.db
      - key: SOMA_IP_SALT
        sync: false
      - key: SOMA_DASH_PASSWORD
        sync: false
      - key: SOMA_SYNC_TOKEN
        sync: false
