<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SomaPerf · 实时性能与访问监测</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg: #0a0f1e;
    --panel: #101827;
    --panel2: #0d1524;
    --rule: rgba(148,163,184,0.14);
    --ink: #e6edf7;
    --muted: #8b94a7;
    --accent: #00d4aa;
    --accent2: #3b82f6;
    --purple: #8b5cf6;
    --orange: #f59e0b;
    --red: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
  }
  .bg-grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(0,212,170,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,170,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(ellipse 600px 400px at 20% 10%, rgba(0,212,170,0.08) 0%, transparent 70%),
      radial-gradient(ellipse 500px 350px at 80% 30%, rgba(59,130,246,0.06) 0%, transparent 70%);
  }
  .container { position: relative; z-index: 1; max-width: 1440px; margin: 0 auto; padding: 24px; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--rule);
    flex-wrap: wrap; gap: 14px;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: var(--bg);
    box-shadow: 0 0 20px rgba(0,212,170,0.3);
  }
  .brand h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
  .brand p { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .live-badge {
    display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 20px;
    background: rgba(0,212,170,0.1); border: 1px solid rgba(0,212,170,0.25);
    font-size: 12px; color: var(--accent);
  }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 8px var(--accent); animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .seg button {
    background: var(--panel); color: var(--muted); border: none; padding: 8px 18px;
    font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: rgba(0,212,170,0.15); color: var(--accent); }
  .updated { font-size: 12px; color: var(--muted); }
  .cards {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px 16px;
  }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 24px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 11px; color: var(--muted); margin-top: 5px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 16px;
  }
  .panel {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: 16px;
    min-width: 0;
  }
  .panel.wide { grid-column: 1 / -1; }
  .panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: var(--ink); }
  .chart { width: 100%; height: 280px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td:first-child, th:first-child { padding-left: 4px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px;
    background: rgba(59,130,246,0.15); color: #7db2ff;
  }
  .tag.click { background: rgba(0,212,170,0.14); color: var(--accent); }
  .tag.exit { background: rgba(139,92,246,0.15); color: #b39dff; }
  .tag.error { background: rgba(239,68,68,0.15); color: #ff8a8a; }
  .tag.heartbeat { background: rgba(245,158,11,0.14); color: #ffc46b; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 14px; }
  .login-overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center;
    background: rgba(6,10,20,0.9); backdrop-filter: blur(4px);
  }
  .login-overlay.show { display: flex; }
  .login-box {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 16px;
    padding: 32px; width: 320px; text-align: center;
  }
  .login-box h2 { font-size: 18px; margin-bottom: 8px; }
  .login-box p { font-size: 13px; color: var(--muted); }
  .login-box input {
    width: 100%; padding: 10px 12px; margin: 16px 0 12px; border-radius: 8px;
    border: 1px solid var(--rule); background: var(--panel2); color: var(--ink); font-size: 14px;
  }
  .login-box button {
    width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: var(--bg); font-weight: 600; font-size: 14px;
  }
  .login-err { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }
  footer { margin-top: 20px; text-align: center; font-size: 12px; color: var(--muted); }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
    .panel.wide { grid-column: auto; }
  }
</style>
</head>
<body>
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2>SomaPerf 看板</h2>
    <p>请输入访问密码</p>
    <input type="password" id="dashPass" placeholder="访问密码" autocomplete="current-password">
    <button onclick="doLogin()">进入看板</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>
<div class="bg-grid"></div>
<div class="bg-glow"></div>
<div class="container">
  <header class="header">
    <div class="brand">
      <div class="logo">SP</div>
      <div>
        <h1>SomaPerf · 实时性能与访问监测</h1>
        <p>www.somaagent.com.cn</p>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
      <div class="seg">
        <button data-days="7" class="active">近 7 天</button>
        <button data-days="30">近 30 天</button>
      </div>
      <div class="updated" id="updated">加载中…</div>
    </div>
  </header>

  <section class="cards" id="cards"></section>

  <section class="grid">
    <div class="panel wide"><h3>访问趋势（PV / UV / 独立 IP）</h3><div class="chart" id="trendChart"></div></div>
    <div class="panel"><h3>设备分布</h3><div class="chart" id="deviceChart"></div></div>
    <div class="panel"><h3>浏览器分布</h3><div class="chart" id="browserChart"></div></div>
    <div class="panel"><h3>核心性能指标（均值）</h3><div class="chart" id="perfChart"></div></div>
    <div class="panel"><h3>访问时段分布（小时）</h3><div class="chart" id="hourChart"></div></div>
    <div class="panel"><h3>操作系统分布</h3><div class="chart" id="osChart"></div></div>
    <div class="panel wide"><h3>Top 页面</h3><div id="pageBox"></div></div>
    <div class="panel wide"><h3>最近事件</h3><div id="recentBox"></div></div>
  </section>

  <footer>数据每 60 秒自动刷新 · 原始 IP 已脱敏 · SomaPerf v0.2.0</footer>
</div>

<script>
var currentDays = 7;
var charts = {};

var C_TEAL = '#00d4aa', C_BLUE = '#3b82f6', C_PURPLE = '#8b5cf6',
    C_ORANGE = '#f59e0b', C_RED = '#ef4444', C_GRAY = '#64748b';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function num(v) { return v == null ? '-' : Number(v).toLocaleString('zh-CN'); }
function pct(v) { return v == null ? '-' : (v * 100).toFixed(1) + '%'; }
function ms(v) { return v == null ? '-' : Math.round(v) + ' ms'; }
function dur(v) {
  if (v == null) return '-';
  var s = Math.round(v / 1000);
  if (s < 60) return s + ' 秒';
  return Math.floor(s / 60) + ' 分 ' + (s % 60) + ' 秒';
}
function fmtTime(ts) {
  var d = new Date(ts);
  return d.toLocaleString('zh-CN', { hour12: false, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function prettyPage(p) {
  if (!p) return '-';
  try { return decodeURIComponent(p); } catch (e) { return p; }
}
function typeTag(t) {
  var map = { click: 'click', page_exit: 'exit', js_error: 'error', resource_error: 'error', heartbeat: 'heartbeat' };
  return '<span class="tag ' + (map[t] || '') + '">' + esc(t) + '</span>';
}
function getToken() {
  try { return sessionStorage.getItem('soma_dash_token') || ''; } catch (e) { return ''; }
}
function setToken(t) {
  try { sessionStorage.setItem('soma_dash_token', t); } catch (e) {}
}
function showLogin(msg) {
  document.getElementById('loginOverlay').classList.add('show');
  if (msg) document.getElementById('loginErr').textContent = msg;
}
function hideLogin() {
  document.getElementById('loginOverlay').classList.remove('show');
}
function doLogin() {
  var t = document.getElementById('dashPass').value.trim();
  if (!t) return;
  setToken(t);
  document.getElementById('loginErr').textContent = '';
  load();
}

function chart(id) {
  if (!charts[id]) charts[id] = echarts.init(document.getElementById(id));
  return charts[id];
}
function baseOption() {
  return {
    backgroundColor: 'transparent',
    textStyle: { color: '#8b94a7' },
    tooltip: { trigger: 'axis', backgroundColor: '#0d1524', borderColor: 'rgba(148,163,184,0.25)', textStyle: { color: '#e6edf7' } },
    grid: { left: 12, right: 18, top: 30, bottom: 8, containLabel: true },
    legend: { textStyle: { color: '#8b94a7' }, top: 0 }
  };
}

function renderCards(t) {
  var cards = [
    ['页面浏览量 PV', num(t.pv), '期间累计'],
    ['独立访客 UV', num(t.uv), '按 visitor_id 去重'],
    ['独立 IP', num(t.ips), 'IP 已哈希脱敏'],
    ['Bot 占比', pct(t.botRatio), 'Bot ' + num(t.botPv) + ' / PV ' + num(t.pv)],
    ['平均停留', dur(t.avgDurationMs), '页面打开到离开'],
    ['有效停留', dur(t.avgActiveMs), '扣除后台/切走时间'],
    ['点击会话率', pct(t.clickRate), '产生点击的会话占比'],
    ['卡顿会话占比', pct(t.lagSessionRatio), '存在 >50ms 长任务'],
    ['平均 LCP', ms(t.avgLcp), '最大内容渲染'],
    ['平均 TTFB', ms(t.avgTtfb), '服务器响应'],
    ['平均 INP', ms(t.avgInp), '交互响应'],
    ['JS/资源错误', num(t.jsErrors + t.resourceErrors), 'JS ' + num(t.jsErrors) + ' / 资源 ' + num(t.resourceErrors)]
  ];
  document.getElementById('cards').innerHTML = cards.map(function (c) {
    return '<div class="card"><div class="label">' + esc(c[0]) + '</div><div class="value">' + esc(c[1]) +
           '</div><div class="sub">' + esc(c[2]) + '</div></div>';
  }).join('');
}

function renderTrend(daily) {
  var days = daily.map(function (d) { return d.day; });
  var opt = baseOption();
  opt.xAxis = { type: 'category', data: days, axisLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } } };
  opt.yAxis = { type: 'value', splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } } };
  opt.series = [
    { name: 'PV', type: 'line', smooth: true, data: daily.map(function (d) { return d.pv; }), itemStyle: { color: C_TEAL }, areaStyle: { opacity: 0.12 } },
    { name: 'UV', type: 'line', smooth: true, data: daily.map(function (d) { return d.uv; }), itemStyle: { color: C_BLUE } },
    { name: '独立IP', type: 'line', smooth: true, data: daily.map(function (d) { return d.ips; }), itemStyle: { color: C_PURPLE } }
  ];
  chart('trendChart').setOption(opt, true);
}

function pie(id, rows, colors) {
  var opt = {
    backgroundColor: 'transparent',
    tooltip: { trigger: 'item', backgroundColor: '#0d1524', textStyle: { color: '#e6edf7' } },
    legend: { bottom: 0, textStyle: { color: '#8b94a7' }, type: 'scroll' },
    series: [{
      type: 'pie', radius: ['42%', '68%'], center: ['50%', '45%'],
      label: { color: '#8b94a7', formatter: '{b}\n{c}' },
      data: rows.map(function (r, i) { return { name: r.name || '未知', value: r.value, itemStyle: { color: colors[i % colors.length] } }; })
    }]
  };
  chart(id).setOption(opt, true);
}

function barH(id, rows, color) {
  var top = rows.slice(0, 8).reverse();
  var opt = baseOption();
  opt.xAxis = { type: 'value', splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } } };
  opt.yAxis = { type: 'category', data: top.map(function (r) { return r.name || '未知'; }), axisLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } } };
  opt.legend = { show: false };
  opt.series = [{ type: 'bar', data: top.map(function (r) { return r.value; }), itemStyle: { color: color, borderRadius: [0, 4, 4, 0] }, barMaxWidth: 18 }];
  chart(id).setOption(opt, true);
}

function renderPerf(a) {
  var items = [
    ['TTFB', a.avgTtfb], ['FCP', a.avgFcp], ['LCP', a.avgLcp], ['INP', a.avgInp]
  ];
  var opt = baseOption();
  opt.xAxis = { type: 'category', data: items.map(function (i) { return i[0]; }), axisLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } } };
  opt.yAxis = { type: 'value', name: 'ms', splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } } };
  opt.legend = { show: false };
  opt.series = [{
    type: 'bar', barMaxWidth: 42, data: items.map(function (i) { return i[1]; }),
    itemStyle: { color: C_TEAL, borderRadius: [6, 6, 0, 0] },
    label: { show: true, position: 'top', color: '#8b94a7', formatter: function (p) { return p.value == null ? '-' : Math.round(p.value) + 'ms'; } }
  }];
  chart('perfChart').setOption(opt, true);
}

function renderHour(hours) {
  var data = [];
  for (var h = 0; h < 24; h++) data.push(0);
  hours.forEach(function (r) { data[r.hour] = r.pv; });
  var opt = baseOption();
  opt.xAxis = { type: 'category', data: data.map(function (_, i) { return i + '时'; }), axisLine: { lineStyle: { color: 'rgba(148,163,184,0.2)' } } };
  opt.yAxis = { type: 'value', splitLine: { lineStyle: { color: 'rgba(148,163,184,0.08)' } } };
  opt.legend = { show: false };
  opt.series = [{ type: 'bar', data: data, itemStyle: { color: C_BLUE, borderRadius: [4, 4, 0, 0] }, barMaxWidth: 16 }];
  chart('hourChart').setOption(opt, true);
}

function renderPages(pages) {
  var box = document.getElementById('pageBox');
  if (!pages.length) { box.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  var html = '<table><thead><tr><th>页面</th><th>PV</th><th>UV</th><th>占比</th></tr></thead><tbody>';
  var total = pages.reduce(function (s, p) { return s + p.pv; }, 0);
  pages.forEach(function (p) {
    html += '<tr><td>' + esc(prettyPage(p.page)) + '</td><td>' + num(p.pv) + '</td><td>' + num(p.uv) + '</td><td>' + pct(p.pv / total) + '</td></tr>';
  });
  box.innerHTML = html + '</tbody></table>';
}

function renderRecent(rows) {
  var box = document.getElementById('recentBox');
  if (!rows.length) { box.innerHTML = '<div class="empty">暂无数据 — 等埋点页面上线后这里会出现实时事件</div>'; return; }
  var html = '<table><thead><tr><th>时间</th><th>类型</th><th>访客</th><th>页面</th><th>设备/系统/浏览器</th><th>Bot 分</th></tr></thead><tbody>';
  rows.forEach(function (r) {
    html += '<tr><td>' + esc(fmtTime(r.ts)) + '</td><td>' + typeTag(r.event_type) + '</td>' +
            '<td>' + esc(r.visitor_id || '-') + '</td><td>' + esc(prettyPage(r.page)) + '</td>' +
            '<td>' + esc([r.device, r.os, r.browser].filter(Boolean).join(' / ') || '-') + '</td>' +
            '<td>' + (r.bot_score == null ? '-' : r.bot_score + (r.is_bot ? ' (Bot)' : '')) + '</td></tr>';
  });
  box.innerHTML = html + '</tbody></table>';
}

function render(data) {
  hideLogin();
  renderCards(data.totals);
  renderTrend(data.daily);
  pie('deviceChart', data.devices, [C_TEAL, C_BLUE, C_PURPLE, C_ORANGE, C_GRAY]);
  barH('browserChart', data.browsers, C_PURPLE);
  renderPerf(data.totals);
  renderHour(data.hours);
  pie('osChart', data.os, [C_BLUE, C_TEAL, C_PURPLE, C_ORANGE, C_RED, C_GRAY]);
  renderPages(data.topPages);
  renderRecent(data.recent);
  document.getElementById('updated').textContent = '更新于 ' + fmtTime(data.generatedAt);
}

function load() {
  fetch('/api/dashboard?days=' + currentDays, { headers: { 'X-Dash-Token': getToken() } })
    .then(function (r) {
      if (r.status === 401) {
        var err = new Error('unauthorized');
        err.status = 401;
        throw err;
      }
      return r.json();
    })
    .then(render)
    .catch(function (e) {
      if (e.status === 401) {
        showLogin(getToken() ? '密码错误，请重试' : '请输入访问密码');
      } else {
        document.getElementById('updated').textContent = '加载失败：' + e.message;
      }
    });
}

document.getElementById('dashPass').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter') doLogin();
});

document.querySelectorAll('.seg button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.seg button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentDays = Number(btn.dataset.days);
    load();
  });
});

window.addEventListener('resize', function () {
  Object.keys(charts).forEach(function (k) { charts[k].resize(); });
});

load();
setInterval(load, 60000);
</script>
</body>
</html>
